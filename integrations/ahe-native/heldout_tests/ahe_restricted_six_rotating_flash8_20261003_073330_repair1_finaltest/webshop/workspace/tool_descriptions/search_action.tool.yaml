type: tool
name: search_action
description: Search the store with keywords. Use the product TYPE NOUN of the instruction plus its distinguishing words (material, flavour, colour, size, count, model, brand) - for example "low carb bagel" or "samsung galaxy a71 mobile". Do NOT include the instruction's price wording such as "price lower than 60 dollars"; price words dilute the results. A result page lists ASIN / TITLE / PRICE triples ten at a time; about 50 results exist, so the list is five pages long and every page after the fifth is blank. An episode is cut off after about 20 tool calls, so read the ten titles in front of you first. The instruction is written from the product it wants, so the listing to open is the one whose title carries the product TYPE NOUN, the NUMBERS the instruction names (a listing with 10x6.5ft is not the one asking for 6 foot by 4 foot), and as many of the instruction's other words as possible - compare all ten titles before clicking, and prefer the best match over the first plausible one. Only plain filler adjectives such as "high", "performance", "long lasting" or "cruelty free" may be absent from the correct listing's title. If no title carries the type noun and the numbers, search again with different, shorter keywords rather than paging through the list, and never settle for an accessory, a look-alike or a different size/model. Re-sending the same keywords returns the identical page.
input_schema:
  type: object
  properties:
    keywords:
      type: string
      description: The keywords to use in the search function.
  required:
  - keywords
  additionalProperties: false
disable_parallel: true
