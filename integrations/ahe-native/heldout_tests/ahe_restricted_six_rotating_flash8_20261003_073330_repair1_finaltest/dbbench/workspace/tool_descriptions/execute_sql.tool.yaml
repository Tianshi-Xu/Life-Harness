type: tool
name: execute_sql
description: >-
  Executes a given SQL statement on the database and returns the raw MySQL result.
  Provide exactly ONE statement per call. Backtick every table or column name that
  contains a space, parenthesis, '$' or other punctuation and copy it exactly as the
  question spells it, e.g. `SELECT * FROM \`Golf Scores\` WHERE \`Money ( $ )\` > 5500;`
  - never replace a space in a name with '_'. Escape renderings in the output (`\xa0`,
  `\n`) are not literal characters: write the real character. An `INSERT`/`UPDATE`/`DELETE`
  returns `[]` no matter how many rows it changed, so confirm a modification with a SELECT
  that looks for the NEW value you wrote, and never send the same modification twice (a
  repeated INSERT adds a duplicate row). A `SELECT` that returns `[]` matched no row, so it
  is not an answer; inspect the table and fix the condition. Errors print as e.g.
  `1292 (22007) Truncated incorrect INTEGER value` and the statement did not run - never
  CAST a text column to a number. A question that asks for a list of the table's records
  ("find all ...", "list all ...") is answered with whole rows, so write that SELECT as
  `SELECT * FROM <table> WHERE ...;` - naming only some columns there loses the values the
  answer is compared on. A "first/last ... listed" (or "on the chart") question means the row
  the table itself lists first/last: `ORDER BY <column> LIMIT 1` re-sorts the rows and can pick
  a different one. Send at most two identical statements; never end the episode without
  `commit_final_answer`.
input_schema:
  type: object
  properties:
    query:
      type: string
      description: The SQL query to be executed.
  required:
  - query
  additionalProperties: false
disable_parallel: true
