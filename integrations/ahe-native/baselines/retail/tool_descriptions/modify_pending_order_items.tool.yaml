type: tool
name: modify_pending_order_items
description: Modify items in a pending order to new items of the same product type.
  For a pending order, this function can only be called once. The agent needs to explain
  the exchange detail and ask for explicit user confirmation (yes/no) to proceed.
input_schema:
  properties:
    order_id:
      description: The order id, such as '#W0000000'. Be careful there is a '#' symbol
        at the beginning of the order id.
      title: Order Id
      type: string
    item_ids:
      description: The item ids to be modified, each such as '1008292230'. There could
        be duplicate items in the list.
      items:
        type: string
      title: Item Ids
      type: array
    new_item_ids:
      description: The item ids to be modified for, each such as '1008292230'. There
        could be duplicate items in the list. Each new item id should match the item
        id in the same position and be of the same product.
      items:
        type: string
      title: New Item Ids
      type: array
    payment_method_id:
      description: The payment method id to pay or receive refund for the item price
        difference, such as 'gift_card_0000000' or 'credit_card_0000000'. These can
        be looked up from the user or order details.
      title: Payment Method Id
      type: string
  required:
  - order_id
  - item_ids
  - new_item_ids
  - payment_method_id
  title: parameters
  type: object
disable_parallel: true
