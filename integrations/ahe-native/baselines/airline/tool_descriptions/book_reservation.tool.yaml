type: tool
name: book_reservation
description: Book a reservation.
input_schema:
  $defs:
    FlightInfo:
      properties:
        flight_number:
          description: Flight number, such as 'HAT001'.
          title: Flight Number
          type: string
        date:
          description: The date for the flight in the format 'YYYY-MM-DD', such as
            '2024-05-01'.
          title: Date
          type: string
      required:
      - flight_number
      - date
      title: FlightInfo
      type: object
    Passenger:
      properties:
        first_name:
          description: Passenger's first name
          title: First Name
          type: string
        last_name:
          description: Passenger's last name
          title: Last Name
          type: string
        dob:
          description: Date of birth in YYYY-MM-DD format
          title: Dob
          type: string
      required:
      - first_name
      - last_name
      - dob
      title: Passenger
      type: object
    Payment:
      properties:
        payment_id:
          description: Unique identifier for the payment
          title: Payment Id
          type: string
        amount:
          description: Payment amount in dollars
          title: Amount
          type: integer
      required:
      - payment_id
      - amount
      title: Payment
      type: object
  properties:
    user_id:
      description: The ID of the user to book the reservation such as 'sara_doe_496'`.
      title: User Id
      type: string
    origin:
      description: The IATA code for the origin city such as 'SFO'.
      title: Origin
      type: string
    destination:
      description: The IATA code for the destination city such as 'JFK'.
      title: Destination
      type: string
    flight_type:
      description: The type of flight such as 'one_way' or 'round_trip'.
      enum:
      - round_trip
      - one_way
      title: Flight Type
      type: string
    cabin:
      description: The cabin class such as 'basic_economy', 'economy', or 'business'.
      enum:
      - business
      - economy
      - basic_economy
      title: Cabin
      type: string
    flights:
      description: An array of objects containing details about each piece of flight.
      items:
        anyOf:
        - $ref: '#/$defs/FlightInfo'
        - additionalProperties: true
          type: object
      title: Flights
      type: array
    passengers:
      description: An array of objects containing details about each passenger.
      items:
        anyOf:
        - $ref: '#/$defs/Passenger'
        - additionalProperties: true
          type: object
      title: Passengers
      type: array
    payment_methods:
      description: An array of objects containing details about each payment method.
      items:
        anyOf:
        - $ref: '#/$defs/Payment'
        - additionalProperties: true
          type: object
      title: Payment Methods
      type: array
    total_baggages:
      description: The total number of baggage items to book the reservation.
      title: Total Baggages
      type: integer
    nonfree_baggages:
      description: The number of non-free baggage items to book the reservation.
      title: Nonfree Baggages
      type: integer
    insurance:
      description: Whether the reservation has insurance.
      enum:
      - 'yes'
      - 'no'
      title: Insurance
      type: string
  required:
  - user_id
  - origin
  - destination
  - flight_type
  - cabin
  - flights
  - passengers
  - payment_methods
  - total_baggages
  - nonfree_baggages
  - insurance
  title: parameters
  type: object
disable_parallel: true
