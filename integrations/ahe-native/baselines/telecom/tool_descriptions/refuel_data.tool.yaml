type: tool
name: refuel_data
description: 'Refuels data for a specific line, adding to the customer''s bill.


  Checks: Line status must be Active, Customer owns the line.

  Logic: Adds data to the line and charges customer based on the plan''s refueling
  rate.'
input_schema:
  properties:
    customer_id:
      description: ID of the customer who owns the line.
      title: Customer Id
      type: string
    line_id:
      description: ID of the line to refuel data for.
      title: Line Id
      type: string
    gb_amount:
      description: Amount of data to add in gigabytes.
      title: Gb Amount
      type: number
  required:
  - customer_id
  - line_id
  - gb_amount
  title: parameters
  type: object
disable_parallel: true
